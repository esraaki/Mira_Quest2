name: Validate MIRA Quest 2 scripts
on:
  push:
    paths:
      - '.github/workflows/verify-voyager.yml'
      - 'src/**'
      - 'index.html'
      - 'voyager.css'
      - 'voyager-adventure.css'
      - 'voyager-rebuilt.css'
      - 'smoke-test.cjs'
      - 'voyager-journey-test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check src/game-next.js
          node --check src/story.js
          node --check src/voyager.js
          node --check src/voyager-adventure.js
          node --check src/voyager-score.js
          node --check src/voyager-rebuilt.js
          node --check src/voyager-story.js
      - name: Test mission-card and Voyager navigation
        run: |
          npm install --no-save --ignore-scripts jsdom@26
          node smoke-test.cjs
          node voyager-journey-test.cjs
      - name: Confirm all bundled Voyager media and original mission files
        run: |
          test -s index.html
          test -s src/story.js
          test -s src/game-next.js
          for name in voyager-space jupiter io saturn titan pale-blue-dot golden-record; do
            test -s "assets/voyager/$name.jpg" || { echo "Missing $name"; exit 1; }
          done
          grep -q 'data-act' src/game-next.js
          grep -q 'hubChoose' src/game-next.js
          grep -q 'window.MIRA_VOYAGER_STORY' src/voyager-story.js
          echo 'All source and asset checks passed'
