name: Import original MIRA Quest foundation
on:
  push:
    paths:
      - '.github/workflows/import-mira.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy original game including binary assets
        run: |
          git clone --depth 1 https://github.com/esraaki/mira_quest.git /tmp/mira-original
          rsync -a --exclude='.git' --exclude='.github' /tmp/mira-original/ ./
          git config user.name "MIRA Quest Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import MIRA Quest game and assets"
            git push origin HEAD:main
          fi
